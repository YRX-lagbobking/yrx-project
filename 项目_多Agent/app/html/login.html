<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能健康管家 · 登录</title>
    <!-- Vue2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <!-- Markdown 解析库 marked CDN（结果提示里可能带 Markdown） -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 全局重置 & 字体（与 exam_0914 保持同一套设计语言） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            /* 浅色自然风景图片背景 */
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2940&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* 浅色毛玻璃卡片 */
        #app {
            width: 430px;
            max-width: 96vw;
            border-radius: 36px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
            border: 1px solid rgba(255, 255, 255, 0.9);
            overflow: hidden;
            animation: fadeIn 0.35s ease;
        }

        .brand {
            padding: 34px 36px 8px 36px;
            text-align: center;
        }

        .brand .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 14px auto;
            border-radius: 22px;
            background: rgba(238, 242, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 22px -10px rgba(59, 130, 246, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .brand h1 {
            font-size: 1.35rem;
            font-weight: 650;
            color: #0f2b4a;
            letter-spacing: -0.02em;
        }

        .brand p {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #4a6a8b;
            line-height: 1.6;
        }

        /* 切换 Tab：登录 / 注册 */
        .tabs {
            display: flex;
            gap: 8px;
            margin: 20px 36px 0 36px;
            padding: 5px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
        }

        .tabs button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 11px 0;
            border-radius: 34px;
            font-size: 0.92rem;
            font-weight: 550;
            color: #4a6a8b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tabs button.active {
            background: #ffffff;
            color: #2563eb;
            box-shadow: 0 8px 18px -10px rgba(59, 130, 246, 0.6);
        }

        .form-area {
            padding: 22px 36px 30px 36px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field label {
            display: block;
            font-size: 0.8rem;
            color: #4a6a8b;
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .field input,
        .field select {
            width: 100%;
            border: 1px solid rgba(203, 220, 240, 0.9);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 13px 18px;
            font-size: 0.95rem;
            color: #0f2b4a;
            outline: none;
            transition: all 0.2s;
        }

        .field input::placeholder {
            color: #94a3b8;
        }

        .field input:focus,
        .field select:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            background: #ffffff;
        }

        .submit-btn {
            margin-top: 8px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: #3b82f6;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 0;
            border-radius: 40px;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: all 0.2s;
            box-shadow: 0 10px 18px -8px #3b82f6;
        }

        .submit-btn:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 14px 22px -8px #3b82f6;
        }

        .submit-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tip {
            margin-top: 4px;
            font-size: 0.76rem;
            color: #64748b;
            text-align: center;
            line-height: 1.7;
        }

        .tip code {
            background: rgba(59, 130, 246, 0.08);
            color: #1e40af;
            padding: 1px 6px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', Consolas, monospace;
        }

        /* 消息提示条 */
        .alert-box {
            margin: 0 36px;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.85rem;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease;
        }

        .alert-box.error {
            background: rgba(254, 226, 226, 0.95);
            color: #991b1b;
        }

        .alert-box.ok {
            background: rgba(220, 252, 231, 0.95);
            color: #166534;
        }

        .footer {
            padding: 0 36px 26px 36px;
            font-size: 0.72rem;
            color: #64748b;
            text-align: center;
            line-height: 1.7;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .brand, .form-area, .footer { padding-left: 22px; padding-right: 22px; }
            .tabs { margin-left: 22px; margin-right: 22px; }
            .alert-box { margin-left: 22px; margin-right: 22px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 品牌区 -->
        <div class="brand">
            <div class="logo">🏡</div>
            <h1>智能健康管家</h1>
            <p>独居老人居家健康管理 · 语音问询 · 风险预警 · 家属联动</p>
        </div>

        <!-- 登录 / 注册 切换 -->
        <div class="tabs">
            <button :class="{ active: mode === 'login' }" @click="switchMode('login')">登 录</button>
            <button :class="{ active: mode === 'register' }" @click="switchMode('register')">注 册</button>
        </div>

        <!-- 提示条 -->
        <div v-if="message" class="alert-box" :class="ok ? 'ok' : 'error'">{{ message }}</div>

        <!-- 登录表单：POST /user/login -->
        <div class="form-area" v-if="mode === 'login'">
            <div class="field">
                <label>邮箱 / 用户名</label>
                <input v-model.trim="loginForm.user_name" placeholder="请输入用户名或邮箱" @keyup.enter="doLogin">
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" v-model.trim="loginForm.password" placeholder="请输入密码" @keyup.enter="doLogin">
            </div>
            <button class="submit-btn" @click="doLogin" :disabled="loading">
                {{ loading ? '登录中…' : '登 录' }}
            </button>
            <div class="tip">
                演示账号：老人 <code>zhangsan</code> / 家属 <code>zhangxiaoming</code> /
                管理员 <code>admin</code>，密码见 <code>sql/init.sql</code>
            </div>
        </div>

        <!-- 注册表单：POST /user/register -->
        <div class="form-area" v-if="mode === 'register'">
            <div class="field">
                <label>用户名</label>
                <input v-model.trim="registerForm.user_name" placeholder="请输入用户名">
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" v-model.trim="registerForm.password" placeholder="请输入密码（建议 6 位以上）">
            </div>
            <div class="field">
                <label>邮箱</label>
                <input v-model.trim="registerForm.email" placeholder="用于接收健康告警与提醒邮件">
            </div>
            <div class="field">
                <label>手机号</label>
                <input v-model.trim="registerForm.phone" placeholder="选填，用于紧急联系">
            </div>
            <div class="field">
                <label>角色</label>
                <select v-model="registerForm.role">
                    <option value="elder">老人（本人使用）</option>
                    <option value="family">家属（查看绑定老人）</option>
                </select>
            </div>
            <button class="submit-btn" @click="doRegister" :disabled="loading">
                {{ loading ? '注册中…' : '注 册' }}
            </button>
            <div class="tip">注册成功后自动返回登录页</div>
        </div>

        <div class="footer">
            本系统仅提供健康提示，不构成医疗诊断；紧急情况请拨打 120
        </div>
    </div>

    <script>
        marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });

        new Vue({
            el: '#app',
            data: {
                mode: 'login',            // login 登录 / register 注册
                loading: false,           // 请求中标记，防重复提交
                message: '',              // 提示文案
                ok: false,                // 提示是否为成功
                loginForm: { user_name: '', password: '' },
                registerForm: { user_name: '', password: '', email: '', phone: '', role: 'elder' }
            },
            mounted() {
                // 已登录（本地有 token）直接按角色跳转，避免重复登录
                const token = localStorage.getItem('token');
                const role = localStorage.getItem('role');
                if (token && role) {
                    this.jumpByRole(role);
                }
            },
            methods: {
                switchMode(m) {
                    this.mode = m;
                    this.message = '';
                },

                /** 统一渲染提示（后端可能返回 Markdown 文案） */
                showMsg(text, isOk) {
                    this.message = text;
                    this.ok = !!isOk;
                },

                /** 把后端返回的 detail（可能是数组/对象/字符串）转成可读文本 */
                pickDetail(res, fallback) {
                    if (!res) return fallback;
                    let d = res.detail !== undefined ? res.detail : (res.msg || res.message);
                    if (d === undefined || d === null) return fallback;
                    if (Array.isArray(d)) {
                        return d.map(item => (item && item.msg) ? item.msg : JSON.stringify(item)).join('；');
                    }
                    if (typeof d === 'object') return JSON.stringify(d);
                    return String(d);
                },

                /**
                 * 按角色跳转
                 * elder  → /static/chat.html   （老人端主页面）
                 * family → /static/family.html （家属端）
                 * admin  → /static/report.html （管理/报告端）
                 */
                jumpByRole(role) {
                    if (role === 'elder') {
                        location.href = '/static/chat.html';
                    } else if (role === 'family') {
                        location.href = '/static/family.html';
                    } else {
                        location.href = '/static/report.html';
                    }
                },

                /** 登录：POST /user/login（JSON） */
                doLogin() {
                    if (!this.loginForm.user_name || !this.loginForm.password) {
                        this.showMsg('请输入用户名和密码', false);
                        return;
                    }
                    this.loading = true;
                    this.message = '';
                    fetch('/user/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.loginForm)
                    })
                        .then(res => res.json().then(body => ({ status: res.status, body: body })))
                        .then(({ status, body }) => {
                            this.loading = false;
                            if (status !== 200) {
                                this.showMsg(this.pickDetail(body, '登录失败，请检查用户名与密码'), false);
                                return;
                            }
                            // 兼容 {code:0,data:{...}} 与直接返回字段两种风格
                            const payload = (body && body.data) ? body.data : body;
                            const token = payload.token || payload.access_token;
                            if (!token) {
                                this.showMsg('登录失败：服务端未返回 token', false);
                                return;
                            }
                            this.saveLogin(payload, token);
                            this.showMsg('登录成功，正在跳转…', true);
                            const role = payload.role || 'elder';
                            setTimeout(() => this.jumpByRole(role), 300);
                        })
                        .catch(err => {
                            this.loading = false;
                            this.showMsg('网络异常：' + err, false);
                        });
                },

                /** 统一保存登录态：token 存 localStorage.token，用户信息存 localStorage */
                saveLogin(payload, token) {
                    localStorage.setItem('token', token);
                    localStorage.setItem('user_id', payload.user_id || payload.userId || '');
                    localStorage.setItem('user_name', payload.user_name || payload.userName || '');
                    localStorage.setItem('role', payload.role || 'elder');
                    if (payload.email) localStorage.setItem('email', payload.email);
                },

                /** 注册：POST /user/register（JSON） */
                doRegister() {
                    const f = this.registerForm;
                    if (!f.user_name || !f.password) {
                        this.showMsg('用户名与密码不能为空', false);
                        return;
                    }
                    if (f.password.length < 6) {
                        this.showMsg('密码长度至少 6 位', false);
                        return;
                    }
                    this.loading = true;
                    this.message = '';
                    fetch('/user/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(f)
                    })
                        .then(res => res.json().then(body => ({ status: res.status, body: body })))
                        .then(({ status, body }) => {
                            this.loading = false;
                            if (status !== 200 && status !== 201) {
                                this.showMsg(this.pickDetail(body, '注册失败，请更换用户名'), false);
                                return;
                            }
                            this.showMsg('注册成功，请使用新账号登录', true);
                            this.loginForm.user_name = f.user_name;
                            this.loginForm.password = '';
                            setTimeout(() => { this.mode = 'login'; }, 700);
                        })
                        .catch(err => {
                            this.loading = false;
                            this.showMsg('网络异常：' + err, false);
                        });
                }
            }
        });
    </script>
</body>
</html>
