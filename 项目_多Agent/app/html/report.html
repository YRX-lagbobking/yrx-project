<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能健康管家 · 健康报告</title>
    <!-- Vue2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <!-- Markdown 解析库 marked CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2940&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #app {
            width: 1400px;
            max-width: 99vw;
            height: 94vh;
            display: flex;
            flex-direction: column;
            border-radius: 36px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .disclaimer-bar {
            padding: 9px 20px;
            font-size: 0.82rem;
            color: #92400e;
            background: rgba(254, 243, 199, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        .disclaimer-bar b { color: #b45309; }

        .header {
            padding: 20px 30px 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.9);
        }

        .header .title-area { display: flex; align-items: center; gap: 12px; }

        .header h2 {
            font-size: 1.32rem;
            font-weight: 650;
            color: #0f2b4a;
            letter-spacing: -0.02em;
        }

        .status-badge {
            background: rgba(220, 252, 231, 0.95);
            color: #166534;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .status-badge::before {
            content: '';
            width: 6px; height: 6px; background: #22c55e;
            border-radius: 50%; box-shadow: 0 0 8px #22c55e;
        }

        .status-badge.degraded { background: rgba(254, 243, 199, 0.95); color: #92400e; }
        .status-badge.degraded::before { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

        .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .btn {
            border: 1px solid rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.92);
            color: #1e3a5f;
            font-size: 0.88rem;
            font-weight: 550;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) { background: #ffffff; color: #2563eb; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn.primary {
            background: #3b82f6;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 18px -8px #3b82f6;
        }

        .btn.primary:hover:not(:disabled) { background: #2563eb; color: #ffffff; }

        .btn.active {
            background: #ffffff;
            color: #2563eb;
            border-color: #93c5fd;
            box-shadow: 0 8px 18px -10px rgba(59, 130, 246, 0.7);
        }

        /* 身体区：左筛选 + 右报告 */
        .body-wrap { flex: 1; display: flex; min-height: 0; }

        .side {
            width: 270px;
            flex-shrink: 0;
            padding: 20px 14px;
            overflow-y: auto;
            background: rgba(245, 250, 255, 0.6);
            border-right: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }

        .side h4 {
            font-size: 0.84rem;
            color: #1e3a5f;
            font-weight: 600;
            margin: 4px 6px 10px 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .side .group { margin-bottom: 22px; }

        .type-btn {
            width: 100%;
            border: 1px solid rgba(203, 220, 240, 0.9);
            background: rgba(255, 255, 255, 0.9);
            color: #1e3a5f;
            font-size: 0.9rem;
            font-weight: 550;
            padding: 12px 14px;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 8px;
            text-align: left;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .type-btn:hover { background: #ffffff; border-color: #93c5fd; }

        .type-btn.active {
            background: #ffffff;
            border-color: #93c5fd;
            color: #2563eb;
            box-shadow: 0 8px 18px -12px rgba(59, 130, 246, 0.8);
        }

        .side-tip {
            font-size: 0.74rem;
            color: #64748b;
            line-height: 1.7;
            margin: 0 6px;
        }

        .report-area {
            flex: 1;
            min-width: 0;
            overflow-y: auto;
            padding: 24px 34px 34px 34px;
            background: rgba(255, 255, 255, 0.42);
        }

        .report-area::-webkit-scrollbar, .side::-webkit-scrollbar { width: 6px; }
        .report-area::-webkit-scrollbar-thumb, .side::-webkit-scrollbar-thumb { background: #bfdbfe; border-radius: 20px; }

        .report-card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 26px;
            padding: 26px 32px 30px 32px;
            box-shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.25);
            color: #0f2b4a;
            font-size: 1rem;
            line-height: 1.8;
            word-break: break-word;
        }

        /* Markdown 样式 */
        .report-card h1 { font-size: 1.5rem; font-weight: 650; margin: 0 0 0.8rem 0; color: #0b2545; }
        .report-card h2 {
            font-size: 1.18rem; font-weight: 600; margin: 1.5rem 0 0.6rem 0; color: #12395f;
            padding-left: 12px; border-left: 4px solid #93c5fd;
        }
        .report-card h3 { font-size: 1.04rem; font-weight: 600; margin: 1rem 0 0.4rem 0; }
        .report-card p { margin: 0 0 0.7rem 0; }
        .report-card ul, .report-card ol { margin: 0.5rem 0 0.8rem 1.5rem; }
        .report-card li { margin-bottom: 0.3rem; }
        .report-card table { border-collapse: collapse; width: 100%; margin: 0.8rem 0; font-size: 0.92rem; }
        .report-card th, .report-card td { border: 1px solid #e2e8f0; padding: 9px 13px; text-align: left; }
        .report-card th { background: #f8fafc; font-weight: 600; color: #1e3a5f; }
        .report-card code {
            background: rgba(59, 130, 246, 0.08); color: #1e40af; padding: 2px 6px;
            border-radius: 6px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 0.88rem;
        }
        .report-card pre {
            background: #f1f5f9; border-radius: 12px; padding: 14px 18px; margin: 0.8rem 0;
            overflow-x: auto; border: 1px solid #e2e8f0;
        }
        .report-card pre code { background: transparent; padding: 0; color: #1e293b; }
        .report-card blockquote {
            margin: 0.9rem 0; padding: 0.7rem 1.1rem; border-left: 4px solid #93c5fd;
            background: #f8fafc; border-radius: 0 10px 10px 0; color: #475569; font-size: 0.92rem;
        }
        .report-card blockquote p { margin: 0; }
        .report-card hr { border: none; border-top: 1px solid #e2e8f0; margin: 1.2rem 0; }
        .report-card a { color: #2563eb; text-decoration: none; border-bottom: 1px dashed #93c5fd; }

        .placeholder {
            text-align: center;
            margin: 8vh auto 0 auto;
            color: #4a6a8b;
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            background: rgba(255, 255, 255, 0.72);
            padding: 44px 54px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            max-width: 640px;
        }

        .placeholder i { font-size: 3rem; font-style: normal; opacity: 0.75; }

        .spin {
            width: 34px; height: 34px; border-radius: 50%;
            border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .toast {
            position: fixed; top: 26px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); color: #0f2b4a;
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 14px 30px -14px rgba(0, 0, 0, 0.3);
            padding: 12px 24px; border-radius: 40px; font-size: 0.9rem; z-index: 200;
            animation: fadeIn 0.2s ease;
        }

        @media (max-width: 900px) {
            .side { width: 200px; }
            .report-area { padding: 16px; }
            .report-card { padding: 18px 18px 22px 18px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="disclaimer-bar">
            ⚕️ 报告内容仅作健康提示，<b>不构成医疗诊断</b>；如有明显不适请及时就医，紧急情况拨打 <b>120</b>
        </div>

        <div class="header">
            <div class="title-area">
                <h2>📄 健康报告</h2>
                <span class="status-badge" :class="{ degraded: mode !== 'full' }">{{ modeText }}</span>
            </div>
            <div class="header-actions">
                <span class="btn" style="cursor: default;">👤 {{ userName || userId }}</span>
                <a class="btn" href="/static/chat.html">💬 去问健康管家</a>
                <button class="btn primary" @click="download" :disabled="downloading">
                    {{ downloading ? '正在导出…' : '⬇️ 下载 Word' }}
                </button>
                <button class="btn" @click="logout">退出</button>
            </div>
        </div>

        <div class="body-wrap">
            <aside class="side">
                <div class="group">
                    <h4><i>🗂️</i> 报告类型</h4>
                    <button class="type-btn" :class="{ active: type === 'daily' }" @click="switchType('daily')">
                        📅 日报（当天）
                    </button>
                    <button class="type-btn" :class="{ active: type === 'weekly' }" @click="switchType('weekly')">
                        🗓️ 周报（近 7 天）
                    </button>
                    <button class="btn primary" style="width: 100%; justify-content: center; margin-top: 6px;"
                            @click="load" :disabled="loading">
                        {{ loading ? '生成中…' : '🔄 重新生成' }}
                    </button>
                </div>

                <div class="group">
                    <h4><i>🧑</i> 报告对象</h4>
                    <input v-model.trim="targetUserId" placeholder="老人 user_id，如 u001"
                           style="width: 100%; border: 1px solid rgba(203,220,240,0.9); background: rgba(255,255,255,0.95);
                                  border-radius: 16px; padding: 12px 16px; font-size: 0.9rem; color: #0f2b4a; outline: none;">
                    <div class="side-tip" style="margin-top: 8px;">
                        留空表示查看自己的报告；家属查看绑定老人时填老人的 user_id，
                        越权访问会返回 403。
                    </div>
                </div>

                <div class="group">
                    <h4><i>🔎</i> 报告内容</h4>
                    <div class="side-tip">
                        周报固定四章节：<br>
                        ① 指标概览　② 异常与告警汇总<br>
                        ③ 用药依从性　④ 个性化建议<br>
                        每条建议均标注知识来源，可溯源。
                    </div>
                </div>
            </aside>

            <main class="report-area">
                <div v-if="loading" class="placeholder">
                    <div class="spin"></div>
                    <span>正在生成报告，请稍候…</span>
                </div>

                <div v-else-if="!content" class="placeholder">
                    <i>📄</i>
                    <span>还没有报告内容，点左侧"重新生成"或选择日报 / 周报。</span>
                </div>

                <div v-else class="report-card" v-html="formatMessage(content)"></div>
            </main>
        </div>

        <div class="toast" v-if="toast">{{ toast }}</div>
    </div>

    <script>
        marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });

        new Vue({
            el: '#app',
            data: {
                token: '',
                userId: '',
                userName: '',
                role: '',
                type: 'weekly',          // daily / weekly
                content: '',             // 报告 Markdown 正文
                loading: false,
                downloading: false,
                targetUserId: '',        // 报告对象（留空=自己）
                mode: 'full',
                toast: '',
                toastTimer: null
            },
            computed: {
                modeText() {
                    if (this.mode === 'full') return '服务正常';
                    if (this.mode === 'partial') return '部分功能降级';
                    return '只读模式';
                },
                /** 报告对象：留空或非 admin 时用自己 */
                queryUserId() {
                    if (this.targetUserId) return this.targetUserId;
                    return this.userId;
                }
            },
            mounted() {
                this.token = localStorage.getItem('token') || '';
                this.userId = localStorage.getItem('user_id') || '';
                this.userName = localStorage.getItem('user_name') || '';
                this.role = localStorage.getItem('role') || '';
                if (!this.token) {
                    this.tip('登录已过期，请重新登录');
                    setTimeout(() => location.href = '/static/login.html', 1200);
                    return;
                }
                // 家属默认看第一位绑定老人（后端 /user/me 会返回 bound_elder_ids）
                this.loadMe();
                this.checkHealth();
                this.load();
            },
            methods: {
                tip(t) {
                    this.toast = t;
                    if (this.toastTimer) clearTimeout(this.toastTimer);
                    this.toastTimer = setTimeout(() => { this.toast = ''; }, 2600);
                },
                logout() {
                    ['token', 'user_id', 'user_name', 'role'].forEach(k => localStorage.removeItem(k));
                    location.href = '/static/login.html';
                },
                authHeaders(extra) {
                    return Object.assign({ 'Authorization': 'Bearer ' + this.token }, extra || {});
                },
                authFetch(url, options) {
                    const opt = Object.assign({}, options || {});
                    opt.headers = this.authHeaders(opt.headers || {});
                    return fetch(url, opt).then(res => {
                        if (res.status === 401) {
                            this.tip('登录状态失效，请重新登录');
                            setTimeout(() => location.href = '/static/login.html', 1200);
                        }
                        return res;
                    });
                },
                pickDetail(res, fallback) {
                    if (!res) return fallback;
                    let d = res.detail !== undefined ? res.detail : (res.msg || res.message);
                    if (d === undefined || d === null) return fallback;
                    if (Array.isArray(d)) return d.map(x => (x && x.msg) ? x.msg : JSON.stringify(x)).join('；');
                    if (typeof d === 'object') return JSON.stringify(d);
                    return String(d);
                },
                formatMessage(c) {
                    if (!c) return '';
                    try { return marked.parse(c); }
                    catch (e) { return String(c).replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
                },

                /** GET /user/me：拿当前用户信息（家属用于确定要看哪位老人） */
                loadMe() {
                    this.authFetch('/user/me')
                        .then(res => res.json().then(b => ({ status: res.status, body: b })))
                        .then(({ status, body }) => {
                            if (status !== 200) return;
                            const d = (body && body.data) ? body.data : body;
                            if (!d) return;
                            if (d.user_name) { this.userName = d.user_name; localStorage.setItem('user_name', d.user_name); }
                            if (d.role) { this.role = d.role; localStorage.setItem('role', d.role); }
                            const bound = d.bound_elder_ids || d.elder_ids || d.bind_elders || [];
                            if (this.role === 'family' && bound.length > 0 && !this.targetUserId) {
                                this.targetUserId = bound[0];
                                this.load();
                            }
                        })
                        .catch(() => {});
                },

                switchType(t) {
                    if (this.type === t) return;
                    this.type = t;
                    this.load();
                },

                /** GET /report/daily?user_id= 或 GET /report/weekly?user_id= */
                load() {
                    if (!this.token) return;
                    this.loading = true;
                    const url = '/report/' + this.type + '?user_id=' + encodeURIComponent(this.queryUserId);
                    this.authFetch(url)
                        .then(res => res.json().then(b => ({ status: res.status, body: b })))
                        .then(({ status, body }) => {
                            this.loading = false;
                            if (status !== 200) {
                                this.content = '';
                                this.tip(this.pickDetail(body, '报告生成失败（' + status + '）'));
                                if (status === 403) this.content = '## ⛔ 无权查看\n\n您没有查看该老人健康数据的权限（403）。';
                                return;
                            }
                            // 兼容 {data:"markdown"} / {report_content:"..."} 两种返回
                            const d = (body && body.data !== undefined) ? body.data : body;
                            if (typeof d === 'string') {
                                this.content = d;
                            } else if (d && typeof d === 'object') {
                                this.content = d.report_content || d.content || d.markdown || JSON.stringify(d, null, 2);
                            } else {
                                this.content = '';
                            }
                        })
                        .catch(err => {
                            this.loading = false;
                            this.tip('网络异常：' + err);
                        });
                },

                /** GET /report/download?user_id=&type= ：带 token 用 fetch + blob 下载 Word */
                download() {
                    this.downloading = true;
                    const url = '/report/download?user_id=' + encodeURIComponent(this.queryUserId)
                        + '&type=' + encodeURIComponent(this.type);
                    this.authFetch(url)
                        .then(res => {
                            if (!res.ok) {
                                throw new Error('下载失败（' + res.status + '），请先生成报告');
                            }
                            const dispo = res.headers.get('Content-Disposition') || '';
                            let name = (this.type === 'weekly' ? '健康周报' : '健康日报') + '.docx';
                            const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(dispo);
                            if (m && m[1]) name = decodeURIComponent(m[1]);
                            return res.blob().then(blob => ({ blob: blob, name: name }));
                        })
                        .then(({ blob, name }) => {
                            const href = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = href;
                            a.download = name;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            setTimeout(() => URL.revokeObjectURL(href), 3000);
                            this.downloading = false;
                            this.tip('已开始下载：' + name);
                        })
                        .catch(err => {
                            this.downloading = false;
                            this.tip(String(err.message || err));
                        });
                },

                checkHealth() {
                    fetch('/health')
                        .then(res => res.json())
                        .then(res => {
                            const p = (res && res.data) ? res.data : res;
                            if (p && p.mode) this.mode = p.mode;
                        })
                        .catch(() => { this.mode = 'partial'; });
                }
            }
        });
    </script>
</body>
</html>
